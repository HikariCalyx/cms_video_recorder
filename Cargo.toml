[package]
name = "cms_video_recorder"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cms_video_recorder"
path = "src/main.rs"

[dependencies]
dirs = "6.0.0"
# The "tokio" feature selects a real async backend. Without it,
# `iced::time::every` resolves to a no-op stream and the recording
# countdown would never tick.
iced = { version = "0.13", features = ["image", "tokio"] }
# Settings persistence: %APPDATA%\cms_video_recorder\config.json
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"

[target.'cfg(windows)'.dependencies]
# Windows.Graphics.Capture + Media Foundation encoder, used by the recorder.
# Brings its own (newer) `windows` crate; HWNDs cross the boundary as raw
# pointers, so the two versions never have to agree on types.
windows-capture = "2.0.1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # WASAPI loopback capture, for recording what's playing
    "Win32_Media_Audio",
    # KSDATAFORMAT_SUBTYPE_IEEE_FLOAT, to identify the device's sample format
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    # GetLocalTime, for timestamping output file names
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    # RegisterHotKey, for the system-wide record/stop shortcut
    "Win32_UI_Input_KeyboardAndMouse",
    # IFileOpenDialog in folder-picking mode, for choosing the output directory
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 'z'     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce number of codegen units to allow more optimizations
panic = 'abort'     # Remove stack unwinding logic
strip = true        # Automatically strip symbols from the binary

# Windows: no console window in release builds — handled by the
# #![windows_subsystem] pragma in main.rs, nothing needed here.
[target.'cfg(windows)'.build-dependencies]
# Compiles app.rc (application icon + version/properties resource) and links
# it into the executable. See build.rs.
embed-resource = "3.0"
