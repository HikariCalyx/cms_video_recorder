name: Release installer

on:
  # Trigger when a version tag (e.g. v0.1.0) is pushed.
  # Change to ["*"] to build on every tag instead.
  push:
    tags:
      - "v*"
  # Allow triggering manually from the Actions tab.
  workflow_dispatch:

permissions:
  # `contents: write` lets the final step publish the installer to the
  # GitHub Release when the workflow runs on a tag push.
  contents: write

jobs:
  build-windows-installer:
    name: Build NSIS installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build cms_video_recorder.exe (x86_64-pc-windows-msvc)
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      # Latest stripped-down ffmpeg from HCTOrganization/ffmpeg-build.
      # "releases/latest/download/<asset>" follows the newest release, so the
      # version in the URL never has to be updated by hand.
      - name: Download ffmpeg and rename to ffmpeg.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          curl.exe -fsSL --retry 3 `
            -o "dist\ffmpeg.exe" `
            "https://github.com/HCTOrganization/ffmpeg-build/releases/latest/download/ffmpeg-windows-x86_64.exe"

      - name: Verify ffmpeg binary
        shell: pwsh
        run: & "dist\ffmpeg.exe" -version

      - name: Stage application binary next to ffmpeg
        shell: pwsh
        run: Copy-Item "target\x86_64-pc-windows-msvc\release\cms_video_recorder.exe" "dist\cms_video_recorder.exe"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Read package version from Cargo.toml
        id: package-version
        shell: pwsh
        run: |
          $match = Select-String -Path "Cargo.toml" -Pattern '^version\s*=\s*"([^"]+)"'
          "version=$($match.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: makensis.exe "/DVERSION=${{ steps.package-version.outputs.version }}" install.nsi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cms_video_recorder-${{ steps.package-version.outputs.version }}-setup
          path: dist\cms_video_recorder-${{ steps.package-version.outputs.version }}-setup.exe

      # On tag pushes: create the GitHub Release for the tag if it doesn't
      # exist yet and attach the installer to it. Skipped for manual runs.
      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\cms_video_recorder-${{ steps.package-version.outputs.version }}-setup.exe
          generate_release_notes: true
